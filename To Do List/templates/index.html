
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Our CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container cnt1">

        <!-- Current Date -->
        <div class="show-date">
            <div>
                <i class="fa-solid fa-calendar"></i>
            </div>

            <div id="dateday"></div>
        </div>

        <!-- Header Section -->
        <div class="headers">

            <!-- Left Content -->
            <div class="left-headers">

                <div class="to-do-list">

                    <div class="tick">
                        <i class="fa-solid fa-check"></i>
                    </div>

                    <div class="to-do-list-content">
                        <div class="head1">
                            My <span>To-Do</span> List
                        </div>

                        <div class="para1">
                            Stay organized. Get things done.✨
                        </div>
                    </div>

                </div>

                <!-- Add Task Form -->
                <form action="{{ url_for('index') }}" method="POST">

                    <div class="input-textbox">

                        <div class="add-task-txt-bx">
                            <i class="fa-solid fa-bars-staggered"></i>

                            <input
                                type="text"
                                name="addtask"
                                placeholder="What needs to be done?"
                            >
                        </div>

                        <button type="submit" class="add-task btn btn-sm">
                            <i class="fa-solid fa-plus"></i> Add Task
                        </button>

                    </div>

                </form>

            </div>

            <!-- Right Content -->
            <div class="right-content">

                <img
                    src="{{ url_for('static', filename='image/todo-banner.png') }}"
                    alt="To Do List Banner"
                    class="img-right"
                >

            </div>

        </div>

        <!-- Task Menu -->
        <div class="menus">

            <div class="all all1">
                <i class="fa-solid fa-list-check"></i>

                <div class="all-count" id="all-count">
                    All ({{ count[0] }})
                </div>
            </div>

            <div class="pending all1">
                <i class="fa-solid fa-circle"></i>

                <div class="pending-count" id="pending-count">
                    Pending ({{ pending[0] }})
                </div>
            </div>

            <div class="completed all1">
                <i class="fa-solid fa-circle"></i>

                <div class="completed-count" id="completed-count">
                    Completed ({{ completed[0] }})
                </div>
            </div>

        </div>

        <!-- Task Display Section -->
        <div class="box">

            {% for t in task %}

            <div class="task" data-id="{{ t[0] }}" data-status="{{ t[2] }}">

                <i class="{% if t[2] == 1 %}fa-solid fa-circle-check{% else %}fa-regular fa-circle{% endif %} task-checkbox"></i>

                <div class="task-name {% if t[2] == 1 %}completed-task{% endif %}">
                    {{ t[1] }}
                </div>

                <input type="text" class="edit-input" value="{{ t[1] }}" style="display: none;">

                <div class="calender-color">
                    <i class="fa-solid fa-calendar"></i>

                    <div class="day">
                        {{ t[3] }}
                    </div>
                </div>

                <button class="edit-task btn btn-sm">
                    <i class="fa-solid fa-pen-to-square"></i> Edit
                </button>

                <button class="save-task  btn btn-sm" style="display: none;">
                     Save
                </button>

                <button class="cancel-task cn-task btn btn-sm" style="display: none;">
                    Cancel
                </button>

                <button class="delete-task btn btn-sm">
                    <i class="fa-solid fa-trash"></i> Delete
                </button>

            </div>

            {% endfor %}

        </div>

    </div>

    <!-- Our JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
